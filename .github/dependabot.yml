version: 2
updates:
  # Monthly, minor and patch updates only. Major versions carry breaking changes
  # (e.g. zod 3 -> 4, @sanity/client 6 -> 8), so they are upgraded by hand and tested first.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      dev-dependencies:
        dependency-type: 'development'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
